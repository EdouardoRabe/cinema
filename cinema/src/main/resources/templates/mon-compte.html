<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Mon Compte')}">
</head>
<body>
    <!-- Navigation -->
    <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>Mon <span class="text-gold">Compte</span></h1>
        <p>Gérez vos informations et consultez vos réservations</p>
        <div class="breadcrumb">
            <a th:href="@{/}">Accueil</a>
            <span>/</span>
            <span>Mon compte</span>
        </div>
    </header>

    <!-- Account Content -->
    <section class="section">
        <div class="auth-container">
            <div class="auth-card" style="max-width: 600px;">
                <div class="auth-header">
                    <div class="user-avatar" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 1rem;">
                        <span th:text="${#strings.substring(client.nomComplet, 0, 1).toUpperCase()}">J</span>
                    </div>
                    <h2 th:text="${client.nomComplet}">Jean Dupont</h2>
                    <p th:text="${client.email}">jean@test.com</p>
                </div>

                <div class="account-info">
                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value" th:text="${client.email}">jean@test.com</span>
                    </div>
                    <div class="info-item" th:if="${client.telephone}">
                        <span class="info-label">Téléphone</span>
                        <span class="info-value" th:text="${client.telephone}">+261 34 00 000 00</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Membre depuis</span>
                        <span class="info-value" th:text="${client.creeLe != null ? #temporals.format(client.creeLe, 'dd MMMM yyyy') : 'Récemment'}">15 janvier 2026</span>
                    </div>
                </div>

                <div class="account-actions" style="margin-top: 2rem;">
                    <a th:href="@{/mes-reservations}" class="btn btn-primary btn-full">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        Mes réservations
                    </a>
                    <a th:href="@{/seances}" class="btn btn-outline btn-full" style="margin-top: 1rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        Réserver une séance
                    </a>
                    <a th:href="@{/logout}" class="btn btn-outline btn-full" style="margin-top: 1rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Se déconnecter
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    
    <style>
        .account-info {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--bg-hover);
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--bg-hover);
        }
        .info-label {
            color: var(--text-secondary);
        }
        .info-value {
            font-weight: 500;
        }
    </style>
</body>
</html>
