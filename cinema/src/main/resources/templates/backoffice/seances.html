<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Séances')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Séances</h2>
            <a th:href="@{/backoffice/seances/create}" class="btn btn-primary">Nouvelle séance</a>
        </div>
        
        <!-- Messages de succès -->
        <div th:if="${successMessage}" class="alert alert-success" style="background: rgba(0, 200, 83, 0.15); border: 1px solid #00c853; color: #00c853; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${successMessage}">Succès</span>
        </div>
        
        <!-- Message d'erreur -->
        <div th:if="${errorMessage}" class="alert alert-error" style="background: rgba(229, 9, 20, 0.15); border: 1px solid #e50914; color: #ff6b6b; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span th:text="${errorMessage}">Erreur</span>
        </div>

        <form method="get" th:action="@{/backoffice/seances}" class="filters" style="margin-bottom: 1rem;">
            <div class="filter-group">
                <label class="filter-label">Film</label>
                <select name="filmId" class="filter-select" onchange="this.form.submit()">
                    <option value="">Tous</option>
                    <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titre}" th:selected="${selectedFilm == f.id}"></option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Salle</label>
                <select name="salleId" class="filter-select" onchange="this.form.submit()">
                    <option value="">Toutes</option>
                    <option th:each="s : ${salles}" th:value="${s.id}" th:text="${s.nom}" th:selected="${selectedSalle == s.id}"></option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Date du</label>
                <input type="date" name="dateFrom" class="filter-input" th:value="${selectedDateFrom}">
            </div>
            <div class="filter-group">
                <label class="filter-label">Date au</label>
                <input type="date" name="dateTo" class="filter-input" th:value="${selectedDateTo}">
            </div>
            <div class="filter-group" style="align-self: end;">
                <button type="submit" class="btn btn-primary">Filtrer</button>
                <a th:href="@{/backoffice/seances}" class="btn btn-outline">Réinitialiser</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Film</th>
                        <th>Salle</th>
                        <th>Date & Heure</th>
                        <th>Langue</th>
                        <th>Montant généré par ticket</th>
                        <th>Total Publicite</th>
                        <th>Montant généré par pub</th>
                        <th>Reste à payer</th>
                        <th>CA total</th>
                        <!-- <th>CA max théorique</th> -->
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="seance : ${seances}">
                        <td th:text="${seance.film.titre}">Film</td>
                        <td th:text="${seance.salle.nom}">Salle</td>
                        <td th:text="${#temporals.format(seance.debut, 'dd/MM/yyyy HH:mm')}">01/01/2026 14:00</td>
                        <td th:text="${seance.langue}">VOST</td>
                        <td style="color: var(--gold); font-weight: 600;" th:text="${#numbers.formatDecimal(chiffresAffaires[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <td style="color: #9c27b0; font-weight: 600;" th:text="${#numbers.formatDecimal(montantsTotalPub[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <td style="color: #00bcd4; font-weight: 600;" th:text="${#numbers.formatDecimal(montantsPub[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <td style="font-weight: 600;" th:styleappend="${(restesPubAPayer[seance.id] ?: 0) > 0 ? 'color: #f44336;' : 'color: #4caf50;'}" th:text="${#numbers.formatDecimal(restesPubAPayer[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <td style="color: #4caf50; font-weight: 600;" th:text="${#numbers.formatDecimal((chiffresAffaires[seance.id] ?: 0) + (montantsPub[seance.id] ?: 0), 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <!-- <td style="color: var(--primary); font-weight: 600;" th:text="${#numbers.formatDecimal(capacitesMax[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td> -->
                        <td>
                            <div class="table-actions">
                                <a th:href="@{/backoffice/seances/view/{id}(id=${seance.id})}" class="btn btn-outline">Voir</a>
                                <a th:href="@{/backoffice/seances/edit/{id}(id=${seance.id})}" class="btn btn-primary">Éditer</a>
                                <form th:action="@{/backoffice/seances/delete/{id}(id=${seance.id})}" method="post" onsubmit="return confirm('Supprimer cette séance ?');">
                                    <!-- <button type="submit" class="btn btn-danger">Supprimer</button> -->
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
