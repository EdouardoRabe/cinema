<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Séances')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Séances</h2>
            <a th:href="@{/backoffice/seances/create}" class="btn btn-primary">Nouvelle séance</a>
        </div>

        <form method="get" th:action="@{/backoffice/seances}" class="filters" style="margin-bottom: 1rem;">
            <div class="filter-group">
                <label class="filter-label">Film</label>
                <select name="filmId" class="filter-select" onchange="this.form.submit()">
                    <option value="">Tous</option>
                    <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titre}" th:selected="${selectedFilm == f.id}"></option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Salle</label>
                <select name="salleId" class="filter-select" onchange="this.form.submit()">
                    <option value="">Toutes</option>
                    <option th:each="s : ${salles}" th:value="${s.id}" th:text="${s.nom}" th:selected="${selectedSalle == s.id}"></option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Date</label>
                <input type="date" name="date" class="filter-input" th:value="${selectedDate}">
            </div>
            <div class="filter-group" style="align-self: end;">
                <button type="submit" class="btn btn-primary">Filtrer</button>
                <a th:href="@{/backoffice/seances}" class="btn btn-outline">Réinitialiser</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Film</th>
                        <th>Salle</th>
                        <th>Date & Heure</th>
                        <th>Langue</th>
                        <th>Chiffre d'affaires</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="seance : ${seances}">
                        <td th:text="${seance.id}">1</td>
                        <td th:text="${seance.film.titre}">Film</td>
                        <td th:text="${seance.salle.nom}">Salle</td>
                        <td th:text="${#temporals.format(seance.debut, 'dd/MM/yyyy HH:mm')}">01/01/2026 14:00</td>
                        <td th:text="${seance.langue}">VOST</td>
                        <td style="color: var(--gold); font-weight: 600;" th:text="${#numbers.formatDecimal(chiffresAffaires[seance.id] ?: 0, 1, 'WHITESPACE', 0, 'POINT')} + ' Ar'">0 Ar</td>
                        <td>
                            <a th:href="@{/backoffice/seances/view/{id}(id=${seance.id})}" class="btn btn-outline">Voir</a>
                            <a th:href="@{/backoffice/seances/edit/{id}(id=${seance.id})}" class="btn btn-primary">Éditer</a>
                            <form th:action="@{/backoffice/seances/delete/{id}(id=${seance.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer cette séance ?');">
                                <button type="submit" class="btn btn-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
