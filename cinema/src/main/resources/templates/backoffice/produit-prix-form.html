<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Prix Produit')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Prix du produit: <span th:text="${produit.libelle}" style="color: var(--gold);">Produit</span></h2>
            <a th:href="@{/backoffice/produits}" class="btn btn-outline">← Retour</a>
        </div>

        <!-- Messages flash -->
        <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 1rem;">
            <strong>✓</strong> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" style="margin-bottom: 1rem;">
            <strong>✕</strong> <span th:text="${errorMessage}"></span>
        </div>

        <!-- Formulaire d'ajout de prix -->
        <div class="form-card" style="max-width: 500px; margin-bottom: 2rem;">
            <h3 style="margin-bottom: 1rem; color: var(--gold);">Ajouter un prix</h3>
            <form th:action="@{/backoffice/produits/prix/{id}/save(id=${produit.id})}" method="post">
                <div class="form-group">
                    <label class="form-label">Prix (Ar) *</label>
                    <input type="number" name="prix" class="form-input" required min="0" placeholder="Ex: 10000">
                </div>
                <div class="form-group">
                    <label class="form-label">Date du prix *</label>
                    <input type="date" name="datePrix" class="form-input" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>

        <!-- Historique des prix -->
        <h3 style="margin-bottom: 1rem;">Historique des prix</h3>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Prix</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prix : ${historique}">
                        <td th:text="${#temporals.format(prix.datePrix, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td style="font-weight: 600; color: var(--gold);" th:text="${#numbers.formatDecimal(prix.prix, 0, 'COMMA', 0, 'POINT')} + ' Ar'">10,000 Ar</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(historique)}">
                        <td colspan="2" style="text-align: center; color: #aaa;">Aucun prix enregistré</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
