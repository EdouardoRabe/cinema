<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Séance')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title" th:text="${seance.id} != null ? 'Éditer séance' : 'Nouvelle séance'"></h2>
        </div>
        
        <!-- Messages de succès -->
        <div th:if="${successMessage}" class="alert alert-success" style="background: rgba(0, 200, 83, 0.15); border: 1px solid #00c853; color: #00c853; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${successMessage}">Succès</span>
        </div>
        
        <!-- Message d'erreur général -->
        <div th:if="${errorMessage}" class="alert alert-error" style="background: rgba(229, 9, 20, 0.15); border: 1px solid #e50914; color: #ff6b6b; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span th:text="${errorMessage}">Erreur</span>
        </div>
        
        <!-- Liste des erreurs de validation -->
        <div th:if="${errors != null and !errors.isEmpty()}" class="alert alert-error" style="background: rgba(229, 9, 20, 0.15); border: 1px solid #e50914; color: #ff6b6b; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <strong>Veuillez corriger les erreurs suivantes :</strong>
            </div>
            <ul style="margin: 0; padding-left: 2.5rem;">
                <li th:each="error : ${errors}" th:text="${error}">Erreur</li>
            </ul>
        </div>

        <form th:action="@{/backoffice/seances/save}" method="post">
            <input type="hidden" name="id" th:value="${seance.id}" />
            <div class="form-grid">
                <div class="form-group">
                    <label>Film</label>
                    <select class="form-input" name="film.id" required>
                        <option value="">-- Choisir un film --</option>
                        <option th:each="f : ${films}" th:value="${f.id}" th:text="${f.titre}" th:selected="${seance.film != null and seance.film.id == f.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Salle</label>
                    <select class="form-input" name="salle.id" required>
                        <option value="">-- Choisir une salle --</option>
                        <option th:each="s : ${salles}" th:value="${s.id}" th:text="${s.nom}" th:selected="${seance.salle != null and seance.salle.id == s.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Début</label>
                    <input class="form-input" type="datetime-local" name="debut" th:value="${seance.debut != null ? #temporals.format(seance.debut, 'yyyy-MM-dd''T''HH:mm') : ''}" required />
                </div>
                <div class="form-group">
                    <label>Fin <span style="color: #aaa; font-weight: normal;">(optionnel)</span></label>
                    <input class="form-input" type="datetime-local" name="fin" th:value="${seance.fin != null ? #temporals.format(seance.fin, 'yyyy-MM-dd''T''HH:mm') : ''}" />
                </div>
                <div class="form-group">
                    <label>Langue</label>
                    <select class="form-input" name="langue" required>
                        <option value="FR" th:selected="${seance.langue == 'FR'}">FR</option>
                        <option value="EN" th:selected="${seance.langue == 'EN'}">EN</option>
                        <option value="VOST" th:selected="${seance.langue == 'VOST'}">VOST</option>
                    </select>
                </div>
            </div>

            <div class="form-section" style="margin-top: 1.5rem;">
                <h3 style="margin-bottom: 0.75rem;">Tarifs par type de place et catégorie de personne</h3>
                <p style="color: #aaa; margin-bottom: 1rem;">Saisir le prix pour chaque combinaison type de place / catégorie de personne. Vous pouvez pré-remplir un prix en fonction d'une autre catégorie.</p>
                
                <div th:each="tp, tpStat : ${typePlaces}" class="tarif-type-block" style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 4px solid;" th:style="'margin-bottom: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 4px solid ' + (tp.couleur != null ? tp.couleur : '#6c757d')">
                    <h4 th:text="${tp.libelle}" style="margin-bottom: 0.75rem; color: #fff;">Type place</h4>
                    <div class="form-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem;">
                        <div class="form-group" th:each="cat, catStat : ${categories}">
                            <label th:text="${cat.libelle}" style="font-size: 0.85rem; margin-bottom: 0.25rem;">Catégorie</label>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <input class="form-input tarif-input" type="number" min="0" step="100" 
                                       th:id="${'tarif_' + tp.id + '_' + cat.id}"
                                       th:name="${'tarifs[' + tp.id + '_' + cat.id + ']'}" 
                                       th:value="${tarifsExistants.get(tp.id + '_' + cat.id)}" 
                                       th:data-tp="${tp.id}"
                                       th:data-cat="${cat.id}"
                                       placeholder="Prix en Ariary" />
                                <!-- Option pré-remplissage -->
                                <div class="prefill-option" style="display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap;">
                                    <select class="form-input prefill-source" style="padding: 0.3rem; font-size: 0.75rem; min-width: 80px; flex: 1;"
                                            th:id="${'source_' + tp.id + '_' + cat.id}"
                                            th:data-target="${'tarif_' + tp.id + '_' + cat.id}">
                                        <option value="">-- Source --</option>
                                        <option th:each="catSource : ${categories}" 
                                                th:if="${catSource.id != cat.id}"
                                                th:value="${tp.id + '_' + catSource.id}" 
                                                th:text="${catSource.libelle}">Cat</option>
                                    </select>
                                    <span style="color: #aaa; font-size: 0.75rem;">×</span>
                                    <input type="number" class="form-input prefill-percent" 
                                           th:id="${'percent_' + tp.id + '_' + cat.id}"
                                           style="width: 55px; padding: 0.3rem; font-size: 0.75rem; text-align: center;" 
                                           value="100" min="1" max="200" placeholder="%" />
                                    <span style="color: #aaa; font-size: 0.75rem;">%</span>
                                    <button type="button" class="btn-prefill" 
                                            th:data-target="${'tarif_' + tp.id + '_' + cat.id}"
                                            th:data-source-select="${'source_' + tp.id + '_' + cat.id}"
                                            th:data-percent="${'percent_' + tp.id + '_' + cat.id}"
                                            style="padding: 0.3rem 0.5rem; font-size: 0.7rem; background: var(--gold); color: #000; border: none; border-radius: 4px; cursor: pointer;"
                                            title="Appliquer">
                                        ✓
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 1rem;">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/backoffice/seances}" class="btn btn-outline">Annuler</a>
            </div>
        </form>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Gestion des boutons de pré-remplissage
        document.querySelectorAll('.btn-prefill').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var targetId = this.getAttribute('data-target');
                var sourceSelectId = this.getAttribute('data-source-select');
                var percentId = this.getAttribute('data-percent');
                
                var targetInput = document.getElementById(targetId);
                var sourceSelect = document.getElementById(sourceSelectId);
                var percentInput = document.getElementById(percentId);
                
                if (!sourceSelect.value) {
                    alert('Veuillez sélectionner une catégorie source');
                    return;
                }
                
                var sourceInputId = 'tarif_' + sourceSelect.value;
                var sourceInput = document.getElementById(sourceInputId);
                
                if (!sourceInput || !sourceInput.value || sourceInput.value == '0') {
                    alert('Le prix de la catégorie source doit être rempli en premier');
                    return;
                }
                
                var sourceValue = parseFloat(sourceInput.value);
                var percent = parseFloat(percentInput.value) || 100;
                var calculatedValue = Math.round(sourceValue * percent / 100);
                
                targetInput.value = calculatedValue;
                
                // Animation de confirmation
                targetInput.style.backgroundColor = 'rgba(0, 200, 83, 0.2)';
                setTimeout(function() {
                    targetInput.style.backgroundColor = '';
                }, 500);
            });
        });
    });
    </script>
</body>
</html>
