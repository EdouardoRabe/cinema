<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Nouvelle Publicité')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Nouvelle Publicité</h2>
            <div class="pub-nav-buttons">
                <a th:href="@{/backoffice/publicites}" class="btn btn-outline">Publicités</a>
                <a th:href="@{/backoffice/societes}" class="btn btn-outline">Sociétés</a>
                <a th:href="@{/backoffice/prix-publicite}" class="btn btn-outline">Prix</a>
            </div>
        </div>

        <!-- Messages flash -->
        <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 1rem;">
            <strong>✓</strong> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" style="margin-bottom: 1rem;">
            <strong>✕</strong> <span th:text="${errorMessage}"></span>
        </div>

        <div class="form-card">
            <form th:action="@{/backoffice/publicites/save}" method="post" id="publiciteForm">
                <div class="form-group">
                    <label for="societeId" class="form-label">Société *</label>
                    <select id="societeId" name="societeId" required class="form-input">
                        <option value="">-- Sélectionner une société --</option>
                        <option th:each="s : ${societes}" th:value="${s.id}" th:text="${s.libelle}">Société X</option>
                    </select>
                    <small class="form-hint">
                        Société non listée ? <a th:href="@{/backoffice/societes/create}" style="color: var(--primary);">Créer une nouvelle société</a>
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label">Séances et diffusions *</label>
                    <p class="form-hint" style="margin-bottom: 1rem;">Recherchez et ajoutez des séances avec le nombre de diffusions pour chacune.</p>
                    
                    <!-- Recherche de séance -->
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                        <input type="text" id="seanceSearch" class="form-input" placeholder="Rechercher une séance (film, date...)..." list="seancesList" style="flex: 1;">
                        <datalist id="seancesList">
                            <option th:each="s : ${seances}" 
                                    th:value="${s.film.titre + ' - ' + #temporals.format(s.debut, 'dd/MM/yyyy HH:mm') + ' (' + s.salle.nom + ')'}"
                                    th:data-id="${s.id}"></option>
                        </datalist>
                        <button type="button" id="addSeanceBtn" class="btn btn-primary">Ajouter</button>
                    </div>
                    
                    <!-- Liste des séances sélectionnées -->
                    <div id="selectedSeances" class="selected-seances">
                        <p id="noSeanceMsg" style="color: #888; text-align: center; padding: 1rem;">Aucune séance sélectionnée</p>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Créer la publicité</button>
                    <a th:href="@{/backoffice/publicites}" class="btn btn-outline">Annuler</a>
                </div>
            </form>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    
    <!-- Stocker les données des séances via éléments cachés -->
    <div id="seancesDataContainer" style="display: none;">
        <span th:each="s : ${seances}" 
              th:data-id="${s.id}" 
              th:data-label="${s.film.titre + ' - ' + #temporals.format(s.debut, 'dd/MM/yyyy HH:mm') + ' (' + s.salle.nom + ')'}">
        </span>
    </div>
    
    <script>
        // Charger les données des séances depuis les éléments DOM
        var seancesData = {};
        document.querySelectorAll('#seancesDataContainer span').forEach(function(el) {
            var id = el.dataset.id;
            seancesData[id] = {
                id: id,
                label: el.dataset.label
            };
        });
    </script>
    
    <style>
        .pub-nav-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #444;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-light);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }
        .form-hint {
            display: block;
            margin-top: 0.5rem;
            color: #888;
            font-size: 0.875rem;
        }
        .selected-seances {
            border: 1px solid #444;
            border-radius: 8px;
            background: var(--bg-dark);
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }
        .seance-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #333;
        }
        .seance-item:last-child {
            border-bottom: none;
        }
        .seance-item .seance-info {
            flex: 1;
            font-size: 0.9rem;
        }
        .seance-item .nbfois-input {
            width: 80px;
            padding: 0.5rem;
            border: 1px solid #444;
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-light);
            text-align: center;
        }
        .seance-item .remove-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .seance-item .remove-btn:hover {
            background: #d32f2f;
        }
    </style>
    
    <script>
        var selectedSeances = new Set();
        
        function updateSeancesList() {
            var container = document.getElementById('selectedSeances');
            var noMsg = document.getElementById('noSeanceMsg');
            
            if (selectedSeances.size === 0) {
                noMsg.style.display = 'block';
            } else {
                noMsg.style.display = 'none';
            }
        }
        
        function addSeance() {
            var searchInput = document.getElementById('seanceSearch');
            var searchValue = searchInput.value;
            
            // Trouver la séance correspondante
            var foundId = null;
            for (var id in seancesData) {
                if (seancesData[id].label === searchValue) {
                    foundId = id;
                    break;
                }
            }
            
            if (!foundId) {
                alert('Séance non trouvée. Veuillez sélectionner une séance dans la liste.');
                return;
            }
            
            if (selectedSeances.has(foundId)) {
                alert('Cette séance est déjà ajoutée.');
                return;
            }
            
            selectedSeances.add(foundId);
            
            var container = document.getElementById('selectedSeances');
            var noMsg = document.getElementById('noSeanceMsg');
            noMsg.style.display = 'none';
            
            var item = document.createElement('div');
            item.className = 'seance-item';
            item.dataset.seanceId = foundId;
            item.innerHTML = `
                <div class="seance-info">${seancesData[foundId].label}</div>
                <input type="hidden" name="seanceIds" value="${foundId}">
                <label style="font-size: 0.85rem; color: #aaa;">Nb fois:</label>
                <input type="number" name="nbFoisList" class="nbfois-input" value="1" min="1" required>
                <button type="button" class="remove-btn" onclick="removeSeance(this, '${foundId}')">✕</button>
            `;
            container.appendChild(item);
            
            searchInput.value = '';
        }
        
        function removeSeance(btn, seanceId) {
            selectedSeances.delete(seanceId);
            btn.closest('.seance-item').remove();
            updateSeancesList();
        }
        
        document.getElementById('addSeanceBtn').addEventListener('click', addSeance);
        
        document.getElementById('seanceSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSeance();
            }
        });
        
        document.getElementById('publiciteForm').addEventListener('submit', function(e) {
            if (selectedSeances.size === 0) {
                e.preventDefault();
                alert('Veuillez ajouter au moins une séance.');
            }
        });
    </script>
</body>
</html>
