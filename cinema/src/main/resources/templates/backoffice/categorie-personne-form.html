<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Catégorie de personne')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title" th:text="${categorie.id} != null ? 'Éditer catégorie' : 'Nouvelle catégorie'"></h2>
        </div>
        
        <!-- Messages de succès -->
        <div th:if="${successMessage}" class="alert alert-success" style="background: rgba(0, 200, 83, 0.15); border: 1px solid #00c853; color: #00c853; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${successMessage}">Succès</span>
        </div>
        
        <!-- Message d'erreur -->
        <div th:if="${errorMessage}" class="alert alert-error" style="background: rgba(229, 9, 20, 0.15); border: 1px solid #e50914; color: #ff6b6b; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span th:text="${errorMessage}">Erreur</span>
        </div>

        <form th:action="@{/backoffice/categories-personne/save}" method="post">
            <input type="hidden" name="id" th:value="${categorie.id}" />
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Libellé <span style="color: #e50914;">*</span></label>
                    <input class="form-input" type="text" name="libelle" th:value="${categorie.libelle}" 
                           placeholder="Ex: ADULTE, ENFANT, SENIOR, ETUDIANT..." required />
                    <small style="color: #aaa;">Le libellé sera affiché en majuscules pour les clients.</small>
                </div>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/backoffice/categories-personne}" class="btn btn-outline">Annuler</a>
            </div>
        </form>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
