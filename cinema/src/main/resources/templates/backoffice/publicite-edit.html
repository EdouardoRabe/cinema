<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Backoffice - Modifier Diffusion')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('backoffice')}"></nav>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Modifier la Diffusion</h2>
            <div class="pub-nav-buttons">
                <a th:href="@{/backoffice/publicites}" class="btn btn-outline">📋 Diffusions</a>
                <a th:href="@{/backoffice/societes}" class="btn btn-outline">🏢 Sociétés</a>
                <a th:href="@{/backoffice/prix-publicite}" class="btn btn-outline">💰 Prix</a>
            </div>
        </div>

        <!-- Messages flash -->
        <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 1rem;">
            <strong>✓</strong> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" style="margin-bottom: 1rem;">
            <strong>✕</strong> <span th:text="${errorMessage}"></span>
        </div>

        <div class="info-card" style="margin-bottom: 2rem; padding: 1rem; background: var(--bg-card); border-radius: 8px;">
            <p style="margin: 0;">
                <strong th:text="${publicite.societe.libelle}">Société X</strong> - 
                <span th:text="${publicite.moisAnneeFormate}">Janvier 2026</span>
            </p>
            <p th:if="${prixActuel != null}" style="margin: 0.5rem 0 0 0; color: #aaa;">
                Prix par diffusion: <strong style="color: var(--gold);" th:text="${#numbers.formatDecimal(prixActuel, 0, 'COMMA', 0, 'POINT')} + ' Ar'">200,000 Ar</strong>
            </p>
            <p th:if="${prixActuel == null}" style="margin: 0.5rem 0 0 0; color: var(--gold);">
                ⚠ Aucun prix défini
            </p>
        </div>

        <div class="form-card">
            <form th:action="@{/backoffice/publicites/update/{id}(id=${publicite.id})}" method="post">
                <div class="form-group">
                    <label for="nbFois" class="form-label">Nombre de diffusions *</label>
                    <input type="number" id="nbFois" name="nbFois" required min="1" th:value="${publicite.nbFois}" class="form-input">
                </div>

                <div th:if="${prixActuel != null}" class="form-group" style="padding: 1rem; background: var(--bg-dark); border-radius: 8px;">
                    <label class="form-label" style="margin-bottom: 0.5rem; display: block;">Montant total</label>
                    <p id="estimationMontant" style="margin: 0; font-size: 1.5rem; font-weight: 600; color: var(--gold);">
                        <span th:text="${#numbers.formatDecimal(publicite.nbFois * prixActuel, 0, 'COMMA', 0, 'POINT')}">200,000</span> Ar
                    </p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Mettre à jour</button>
                    <a th:href="@{/backoffice/publicites}" class="btn btn-outline">Annuler</a>
                </div>
            </form>
        </div>
    </section>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    
    <style>
        .pub-nav-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #444;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-light);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }
    </style>
    
    <script th:inline="javascript">
        var prixUnitaire = /*[[${prixActuel}]]*/ null;
        
        if (prixUnitaire !== null) {
            document.getElementById('nbFois').addEventListener('input', function() {
                var nbFois = parseInt(this.value) || 0;
                var total = nbFois * prixUnitaire;
                document.getElementById('estimationMontant').innerHTML = 
                    total.toLocaleString('fr-FR') + ' Ar';
            });
        }
    </script>
</body>
</html>
