<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Inscription')}">
</head>
<body>
    <!-- Navigation -->
    <nav th:replace="~{fragments/layout :: navbar('')}"></nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>Inscription</h1>
        <p>Créez votre compte pour profiter de CinéMax</p>
        <div class="breadcrumb">
            <a th:href="@{/}">Accueil</a>
            <span>/</span>
            <span>Inscription</span>
        </div>
    </header>

    <!-- Register Form -->
    <section class="section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-icon">✨</div>
                    <h2>Rejoignez CinéMax</h2>
                    <p>Créez votre compte en quelques instants</p>
                </div>

                <!-- Message d'erreur -->
                <div th:if="${error}" class="alert alert-error">
                    <span th:text="${error}">Erreur</span>
                </div>

                <form th:action="@{/register}" method="post" class="auth-form">
                    <input type="hidden" name="redirect" th:value="${redirect}">
                    <div class="form-group">
                        <label for="nomComplet">Nom complet</label>
                        <input type="text" id="nomComplet" name="nomComplet" th:value="${nomComplet}" 
                               placeholder="Jean Dupont" required class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input type="email" id="email" name="email" th:value="${email}" 
                               placeholder="votre@email.com" required class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="telephone">Téléphone (optionnel)</label>
                        <input type="tel" id="telephone" name="telephone" th:value="${telephone}" 
                               placeholder="+261 34 00 000 00" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="motDePasse">Mot de passe</label>
                        <input type="password" id="motDePasse" name="motDePasse" 
                               placeholder="Minimum 6 caractères" required minlength="6" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="confirmMotDePasse">Confirmer le mot de passe</label>
                        <input type="password" id="confirmMotDePasse" name="confirmMotDePasse" 
                               placeholder="Confirmez votre mot de passe" required class="form-input">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Créer mon compte
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Déjà inscrit ?</p>
                    <a th:href="@{/login(redirect=${redirect})}" class="btn btn-outline">Se connecter</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
