<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Films à l\'affiche')}">
</head>
<body>
    <!-- Navigation -->
    <nav th:replace="~{fragments/layout :: navbar('films')}"></nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>Films à <span class="text-gold">l'affiche</span></h1>
        <p>Découvrez tous les films actuellement diffusés dans notre cinéma</p>
        <div class="breadcrumb">
            <a th:href="@{/}">Accueil</a>
            <span>/</span>
            <span>Films</span>
        </div>
    </header>

    <!-- Filters -->
    <section class="section" style="padding-top: 0;">
        <form th:action="@{/films}" method="get" class="filters">
            <div class="filter-group">
                <label class="filter-label">Rechercher</label>
                <input type="text" name="titre" class="filter-input" th:value="${selectedTitre}" placeholder="Titre du film...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Genre</label>
                <select name="genre" class="filter-select" onchange="this.form.submit()">
                    <option value="">Tous les genres</option>
                    <option th:each="g : ${genres}" th:value="${g.id}" th:text="${g.libelle}" th:selected="${selectedGenre == g.id}">Genre</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Langue</label>
                <select name="langue" class="filter-select" onchange="this.form.submit()">
                    <option value="">Toutes les langues</option>
                    <option value="FR" th:selected="${selectedLangue == 'FR'}">Français</option>
                    <option value="EN" th:selected="${selectedLangue == 'EN'}">Anglais</option>
                    <option value="VOST" th:selected="${selectedLangue == 'VOST'}">VOST</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Date</label>
                <input type="date" name="date" class="filter-input" th:value="${selectedDate}" onchange="this.form.submit()">
            </div>
            <div class="filter-group" style="align-self: end;">
                <button type="submit" class="btn btn-primary">Rechercher</button>
            </div>
        </form>

        <!-- Films Grid -->
        <div class="films-grid">
            <th:block th:each="film : ${films}">
                <div th:insert="~{fragments/layout :: filmCard(${film})}"></div>
            </th:block>
            <!-- Message si aucun film -->
            <div th:if="${films == null || #lists.isEmpty(films)}" class="empty-state">
                <p class="empty-state-title">Aucun film trouvé avec ces critères.</p>
                <a th:href="@{/films}" class="btn btn-outline mt-3">Réinitialiser les filtres</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
